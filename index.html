<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>日常集 · 动态专栏版 | 邓杰 & 王泊宁</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.5; color: #1e2a3e; background: #f1f5f9; min-height: 100vh; }
        button, input, select, textarea { font: inherit; }
        .app-container { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }
        .create-post-btn { display: none; position: fixed; top: 20px; right: 20px; z-index: 1000; background: #1e3c4c; color: white; padding: 10px 20px; border-radius: 50px; font-size: 0.9rem; box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: 0.3s; font-weight: 600; cursor: pointer; border: none; }
        .create-post-btn:hover { background: #e6a157; transform: translateY(-2px); }
        .section-link { position: absolute; top: 12px; right: 16px; text-decoration: none; font-size: 1.2rem; color: #cbd5e1; transition: 0.3s; font-weight: bold; background: rgba(255,255,240,0.6); border-radius: 30px; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
        .section-link:hover { color: #e6a157; transform: scale(1.2); background: white; }
        .hero-index { min-height: 85vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: linear-gradient(135deg, #fef9f0 0%, #eef2ff 100%); border-radius: 2.5rem; box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1); padding: 2.5rem 1.8rem; }
        .greeting-tag { font-size: 1rem; letter-spacing: 3px; color: #4b6589; background: rgba(255,255,240,0.7); backdrop-filter: blur(2px); padding: 0.2rem 1rem; border-radius: 40px; display: inline-block; margin-bottom: 1rem; }
        .main-headline { font-size: 3rem; font-weight: 800; background: linear-gradient(125deg, #1e3c4c, #2c6e9e, #e6a157); background-clip: text; -webkit-background-clip: text; color: transparent; margin-bottom: 0.5rem; }
        .subhead { color: #5d6f8f; margin-bottom: 3rem; border-bottom: 1px solid #cddfe7; padding-bottom: 0.5rem; display: inline-block; font-weight: 500; }
        .triple-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 2rem; margin: 2rem 0 1.5rem; }
        .daily-card { background: white; width: 250px; padding: 1.8rem 1.2rem; border-radius: 2rem; transition: all 0.3s ease; display: flex; flex-direction: column; align-items: center; gap: 0.8rem; box-shadow: 0 10px 20px rgba(0,0,0,0.05); border: 1px solid rgba(210,225,245,0.6); cursor: pointer; }
        .daily-card:hover { transform: translateY(-8px); box-shadow: 0 25px 35px -12px rgba(0,0,0,0.2); }
        .card-icon { font-size: 3.6rem; background: #f0f4fe; width: 90px; height: 90px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
        .card-name { font-size: 1.8rem; font-weight: 700; color: #1f3b4c; }
        .card-desc { font-size: 0.8rem; color: #5f7f9e; background: #f5f9ff; padding: 0.2rem 0.8rem; border-radius: 30px; }
        .detail-page { max-width: 1100px; margin: 0 auto; }
        .back-home-bar { margin-bottom: 2rem; }
        .back-home-btn { display: inline-flex; align-items: center; gap: 8px; background: #eef2ff; padding: 0.5rem 1.5rem; border-radius: 40px; font-size: 0.9rem; font-weight: 500; color: #1e4a76; cursor: pointer; border: none; }
        .irregular-stack { display: flex; flex-direction: column; gap: 2rem; }
        .block-split-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
        .shape-card { background: white; padding: 1.8rem 1.2rem; box-shadow: 0 8px 18px rgba(0,0,0,0.06); display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; }
        .shape-triangle-left { clip-path: polygon(0% 0%, 100% 0%, 85% 100%, 0% 100%); border-radius: 1.5rem 0 0 1.5rem; margin-right: -6px; z-index: 2; }
        .shape-trapezoid-mid { clip-path: polygon(6% 0%, 94% 0%, 100% 100%, 0% 100%); margin: 0 -6px; z-index: 3; }
        .shape-reverse-triangle { clip-path: polygon(15% 0%, 100% 0%, 100% 100%, 0% 100%); border-radius: 0 1.5rem 1.5rem 0; margin-left: -6px; }
        .block-icon { font-size: 2.6rem; margin-bottom: 0.6rem; }
        .block-single { background: linear-gradient(125deg, #fff8ef, #ffffff); padding: 2rem; clip-path: polygon(4% 0%, 96% 0%, 100% 15%, 100% 85%, 96% 100%, 4% 100%, 0% 85%, 0% 15%); border-radius: 2rem 1rem 2rem 1rem; position: relative; }
        .single-content { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1.5rem; }
        .single-stats { flex: 1; background: #f7efe3; padding: 1rem; border-radius: 1.5rem; text-align: center; }
        .block-split-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        .dual-left, .dual-right { background: white; padding: 1.8rem; position: relative; border-radius: 1rem; }
        .hobby-list { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.8rem 0; }
        .hobby-badge { background: #eef3fc; padding: 0.2rem 0.8rem; border-radius: 30px; font-size: 0.75rem; }

        .column-container { max-width: 1100px; margin: 0 auto; }
        .column-header { margin-bottom: 2rem; text-align: center; }
        .posts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.8rem; margin-top: 1.5rem; }
        .post-card { background: white; border-radius: 1.5rem; padding: 1.5rem 1.5rem 4.2rem; box-shadow: 0 6px 12px rgba(0,0,0,0.05); transition: 0.2s; border: 1px solid #eef2ff; display: flex; flex-direction: column; position: relative; min-height: 160px; }
        .post-card:hover { transform: translateY(-4px); box-shadow: 0 12px 20px rgba(0,0,0,0.1); }
        .post-title { font-size: 1.3rem; font-weight: 700; color: #1e3c4c; margin-bottom: 0.3rem; }
        .post-meta { font-size: 0.75rem; color: #8ba0bc; margin-bottom: 0.5rem; display: flex; gap: 1rem; flex-wrap: wrap; }
        .post-type-badge { background: #eef2ff; padding: 2px 8px; border-radius: 20px; font-size: 0.7rem; color: #2c6e9e; }
        .read-more-link { position: absolute; bottom: 1.2rem; right: 1.5rem; color: #e6a157; font-weight: 500; text-decoration: none; font-size: 0.85rem; cursor: pointer; background: white; padding: 4px 12px; border-radius: 20px; transition: 0.2s; display: inline-block; border: none; }
        .read-more-link:hover { background: #e6a157; color: white; }
        .delete-post-btn { position: absolute; bottom: 1.2rem; left: 1.5rem; color: #b91c1c; font-weight: 600; font-size: 0.82rem; cursor: pointer; background: #fff1f2; padding: 5px 12px; border-radius: 20px; border: 1px solid #fecdd3; transition: 0.2s; }
        .delete-post-btn:hover { background: #dc2626; color: white; border-color: #dc2626; }
        .detail-toolbar { margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
        .detail-delete-btn { background: #fff1f2; color: #b91c1c; border: 1px solid #fecdd3; padding: 0.5rem 1rem; border-radius: 40px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
        .detail-delete-btn:hover { background: #dc2626; color: white; border-color: #dc2626; }
        .comment-create-btn { position: fixed; right: 20px; bottom: 20px; z-index: 1000; background: #2c6e9e; color: white; border: none; border-radius: 50px; padding: 11px 20px; font-size: .9rem; font-weight: 600; cursor: pointer; box-shadow: 0 5px 18px rgba(30,60,76,.28); transition: .2s; }
        .comment-create-btn:hover { background: #e6a157; transform: translateY(-2px); }
        .empty-posts { text-align: center; padding: 3rem; background: #faf9fe; border-radius: 2rem; color: #7c8ba0; }

        .article-detail-page { max-width: 900px; margin: 0 auto; background: white; border-radius: 2rem; padding: 2.5rem; box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1); }
        .article-detail-header { text-align: center; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid #eef2ff; }
        .article-detail-title { font-size: 2.2rem; font-weight: 800; color: #1e3c4c; line-height: 1.3; margin-bottom: 0.8rem; }
        .article-detail-meta { font-size: 0.85rem; color: #8ba0bc; display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap; }
        .article-detail-content { font-size: 1rem; line-height: 1.8; color: #334e68; margin-top: 1.5rem; }
        .article-detail-content p { margin-bottom: 1rem; }
        .article-detail-content img { max-width: 100%; border-radius: 1rem; margin: 1rem 0; cursor: zoom-in; }

        .comments-section { margin-top: 2.5rem; padding-top: 1.8rem; border-top: 1px solid #e2e8f0; }
        .comments-heading { color: #1e3c4c; font-size: 1.25rem; margin-bottom: 1rem; }
        .comments-list { display: flex; flex-direction: column; gap: 1rem; }
        .comment-item { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 1rem; padding: 1rem 1.1rem 3.2rem; position: relative; }
        .comment-meta { color: #8ba0bc; font-size: .75rem; margin-bottom: .55rem; display: flex; align-items: center; gap: .7rem; flex-wrap: wrap; }
        .comment-content { color: #334e68; line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere; }
        .comment-images { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .75rem; margin-top: .9rem; }
        .comment-images img { display: block; width: 100%; height: 160px; object-fit: cover; border-radius: .8rem; cursor: zoom-in; background: #e2e8f0; }
        .comments-empty { color: #8ba0bc; text-align: center; background: #f8fafc; border-radius: 1rem; padding: 1.5rem; }
        .delete-comment-btn { position: absolute; right: .9rem; bottom: .8rem; color: #b91c1c; background: #fff1f2; border: 1px solid #fecdd3; border-radius: 20px; padding: .35rem .8rem; font-size: .76rem; font-weight: 600; cursor: pointer; transition: .2s; }
        .delete-comment-btn:hover { color: white; background: #dc2626; border-color: #dc2626; }

        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 1rem; margin-top: 1.5rem; }
        .gallery-card { background: #f8fafc; border-radius: 1rem; overflow: hidden; border: 1px solid #eef2ff; min-height: 180px; }
        .gallery-card img { display: block; width: 100%; height: 240px; object-fit: cover; cursor: zoom-in; transition: transform .25s ease; }
        .gallery-card img:hover { transform: scale(1.025); }
        .gallery-empty { text-align: center; padding: 2.5rem; color: #7c8ba0; background: #f8fafc; border-radius: 1rem; }

        .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 3000; cursor: pointer; justify-content: center; align-items: center; }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 90%; max-height: 90%; object-fit: contain; border-radius: 8px; }
        .lightbox-close { position: absolute; top: 20px; right: 30px; color: white; font-size: 2rem; cursor: pointer; }

        #editor-overlay, #delete-overlay, #comment-overlay, #comment-delete-overlay { display: none; position: fixed; inset: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; backdrop-filter: blur(5px); }
        .editor-modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; width: 90%; max-width: 640px; padding: 2rem; border-radius: 1.5rem; max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.8rem; border: 1px solid #e2e8f0; border-radius: 0.8rem; background: white; }
        .form-group textarea { height: 150px; resize: vertical; }
        .submit-btn { background: #2c6e9e; color: white; border: none; padding: 1rem; width: 100%; border-radius: 0.8rem; cursor: pointer; font-weight: bold; margin-top: 0.5rem; }
        .submit-btn:disabled { opacity: .6; cursor: wait; }
        .submit-btn.cancel { background: #94a3b8; }
        .loading { text-align: center; padding: 2rem; color: #6c8dae; }
        .upload-guide { background: #e6f7e6; padding: 12px; margin-top: 12px; border-radius: 8px; font-size: 0.82rem; display: none; border-left: 4px solid #2c6e9e; line-height: 1.7; overflow-wrap: anywhere; }
        .upload-guide.error { background: #fee2e2; border-left-color: #dc2626; color: #991b1b; }
        .folder-hint { font-size: 0.72rem; color: #8ba0bc; margin-top: 5px; line-height: 1.6; }
        .token-hint { background: #fff7ed; color: #9a3412; padding: .7rem .8rem; border-radius: .7rem; font-size: .75rem; margin-top: .5rem; }
        .error-message { color: #dc2626; background: #fee2e2; padding: 12px; border-radius: 8px; margin: 10px 0; }
        .selected-files { font-size: .75rem; color: #64748b; margin-top: .5rem; max-height: 95px; overflow-y: auto; }
        .delete-warning { background: #fff7ed; color: #9a3412; padding: .9rem 1rem; border-radius: .8rem; line-height: 1.7; margin-bottom: 1.1rem; border-left: 4px solid #f97316; }
        .delete-target { background: #f8fafc; border: 1px solid #e2e8f0; padding: .9rem 1rem; border-radius: .8rem; margin-bottom: 1.1rem; overflow-wrap: anywhere; }
        .checkbox-row { display: flex; align-items: flex-start; gap: .65rem; padding: .75rem 0; color: #475569; font-size: .88rem; }
        .checkbox-row input { width: auto; margin-top: .2rem; }
        .submit-btn.danger { background: #dc2626; }
        .comment-delete-warning { color: #dc2626; font-size: 1.45rem; font-weight: 800; line-height: 1.55; text-align: center; padding: 1rem; margin-bottom: 1.2rem; background: #fff1f2; border: 2px solid #fecaca; border-radius: 1rem; }
        .dialog-actions { display: flex; gap: .8rem; margin-top: 1rem; }
        .dialog-actions .submit-btn { flex: 1; width: auto; margin-top: 0; }

        .session-banner { display: none; position: fixed; top: 18px; left: 20px; z-index: 1000; background: rgba(255,255,255,.94); border: 1px solid #dbeafe; border-radius: 1rem; padding: .65rem .85rem; box-shadow: 0 5px 18px rgba(30,60,76,.12); color: #1e3c4c; font-size: .84rem; line-height: 1.5; }
        .session-actions { display: flex; align-items: center; gap: .45rem; margin-top: .45rem; }
        .session-action-btn { border: none; border-radius: 20px; padding: .28rem .7rem; font-size: .72rem; cursor: pointer; color: #1e4a76; background: #eef2ff; }
        .session-action-btn:hover { background: #dbeafe; }
        .session-action-btn.logout { color: #64748b; background: #f1f5f9; }

        #auth-overlay, #access-request-overlay, #user-manager-overlay, #review-user-overlay { display: none; position: fixed; inset: 0; width: 100%; height: 100%; background: rgba(15,23,42,.7); z-index: 4000; backdrop-filter: blur(7px); }
        #auth-overlay { display: block; }
        #access-request-overlay, #review-user-overlay { z-index: 4100; }
        .auth-modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 430px; background: white; border-radius: 1.6rem; padding: 2rem; box-shadow: 0 25px 60px rgba(15,23,42,.3); }
        .auth-title { color: #1e3c4c; text-align: center; font-size: 1.7rem; margin-bottom: .35rem; }
        .auth-subtitle { color: #64748b; text-align: center; font-size: .82rem; margin-bottom: 1.4rem; }
        .request-access-btn { display: block; margin: 1rem 0 0 auto; border: none; background: transparent; color: #2c6e9e; cursor: pointer; font-size: .82rem; text-decoration: underline; text-underline-offset: 3px; }
        .request-access-btn:hover { color: #e6a157; }
        .auth-setup-error { color: #b91c1c; background: #fff1f2; border: 1px solid #fecdd3; border-radius: .8rem; padding: .85rem; font-size: .8rem; line-height: 1.6; }
        .current-commenter { background: #eef6ff; color: #1e4a76; border-radius: .8rem; padding: .7rem .8rem; margin-bottom: 1rem; font-size: .84rem; }

        .user-manager-modal { max-width: 720px; }
        .user-list { display: flex; flex-direction: column; gap: .7rem; max-height: 55vh; overflow-y: auto; margin: 1rem 0; }
        .user-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: .9rem; padding: .75rem .9rem; }
        .user-row.admin { background: #eef2ff; border-color: #a5b4fc; }
        .user-row.pending { color: #a16207; background: #fefce8; border-color: #fde68a; cursor: pointer; }
        .user-row.pending:hover { background: #fef9c3; }
        .user-name { font-weight: 700; overflow-wrap: anywhere; }
        .role-badge { display: inline-block; margin-left: .45rem; padding: .12rem .5rem; border-radius: 20px; font-size: .66rem; background: #c7d2fe; color: #3730a3; }
        .remove-user-btn { border: 1px solid #fecdd3; background: #fff1f2; color: #b91c1c; border-radius: 20px; padding: .3rem .7rem; cursor: pointer; font-size: .72rem; flex: none; }
        .remove-user-btn:hover { color: white; background: #dc2626; }
        .protected-admin { color: #6366f1; font-size: .72rem; flex: none; }
        .review-relationship { background: #f8fafc; border-radius: .9rem; padding: 1rem; margin: 1rem 0; color: #334155; line-height: 1.7; }

        @media (max-width: 780px) {
            .block-split-3 { grid-template-columns: 1fr; gap: 1rem; }
            .shape-triangle-left, .shape-trapezoid-mid, .shape-reverse-triangle { clip-path: none; border-radius: 1.5rem; margin: 0; }
            .block-split-2 { grid-template-columns: 1fr; }
            .main-headline { font-size: 2.2rem; }
            .article-detail-page { padding: 1.4rem; }
            .gallery-grid { grid-template-columns: 1fr; }
            .gallery-card img { height: auto; max-height: 70vh; object-fit: contain; }
            .comment-create-btn { right: 14px; bottom: 14px; }
            .comment-images { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .comment-images img { height: 130px; }
            .session-banner { position: static; margin: 0 0 1rem; }
            .create-post-btn { top: 14px; bottom: auto; right: 14px; }
        }
    </style>
</head>
<body>
    <button class="create-post-btn" onclick="openEditor()">✍️ 创作文章</button>
    <div id="session-banner" class="session-banner">
        <div id="session-greeting"></div>
        <div class="session-actions">
            <button id="manage-users-button" class="session-action-btn" onclick="openUserManager()" style="display:none;">管理用户</button>
            <button class="session-action-btn logout" onclick="logoutCurrentUser()">退出登录</button>
        </div>
    </div>
    <div id="app-root" class="app-container"><div class="loading">📡 正在加载...</div></div>

    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="lightbox-close">&times;</span>
        <img id="lightbox-img" src="" alt="图片预览">
    </div>

    <div id="editor-overlay">
        <div class="editor-modal">
            <h2 style="margin-bottom:1.2rem;">📝 新建专栏</h2>

            <div class="form-group">
                <label for="github-token">🔐 GitHub Fine-grained Token</label>
                <input type="password" id="github-token" autocomplete="off" placeholder="仅在本次上传中使用，不会写入网页代码">
                <div class="token-hint">Token 需要该仓库的 Contents: Read and write 权限。不要把 Token 直接写进 index.html 或提交到 GitHub。</div>
            </div>

            <div class="form-group">
                <label for="post-target">📌 归属板块</label>
                <select id="post-target">
                    <optgroup label="邓杰的日常 → posts/dengjie/">
                        <option value="dengjie-b1-1" data-folder="dengjie">游戏世界</option>
                        <option value="dengjie-b1-2" data-folder="dengjie">搞钱日记</option>
                        <option value="dengjie-b1-3" data-folder="dengjie">补全计划</option>
                        <option value="dengjie-b2-1" data-folder="dengjie">近期日常</option>
                        <option value="dengjie-b3-L" data-folder="dengjie">农耕文明</option>
                        <option value="dengjie-b3-R" data-folder="dengjie">双人联结</option>
                    </optgroup>
                    <optgroup label="王泊宁的日常 → posts/wangboning/">
                        <option value="wang-b1-1" data-folder="wangboning">19-212饮品吧</option>
                        <option value="wang-b1-2" data-folder="wangboning">体育生√</option>
                        <option value="wang-b1-3" data-folder="wangboning">Andrea游记</option>
                        <option value="wang-b2-1" data-folder="wangboning">Daily Life</option>
                        <option value="wang-b3-L" data-folder="wangboning">Reading</option>
                        <option value="wang-b3-R" data-folder="wangboning">日常共振</option>
                    </optgroup>
                    <optgroup label="两人的共同日常 → posts/together/">
                        <option value="both-b1-1" data-folder="together">All about MATH</option>
                        <option value="both-b1-2" data-folder="together">两人食记</option>
                        <option value="both-b1-3" data-folder="together">娱乐时间</option>
                        <option value="both-b2-1" data-folder="together">旅行日记</option>
                        <option value="both-b3-L" data-folder="together">共同兴趣</option>
                        <option value="both-b3-R" data-folder="together">未来计划</option>
                    </optgroup>
                </select>
            </div>

            <div class="form-group">
                <label for="post-title">📖 标题</label>
                <input type="text" id="post-title" placeholder="例如：布达佩斯之旅">
            </div>

            <div class="form-group">
                <label for="post-author">✍️ 作者</label>
                <input type="text" id="post-author" placeholder="邓杰 / 王泊宁">
            </div>

            <div class="form-group">
                <label for="post-type">🎨 专栏类型</label>
                <select id="post-type">
                    <option value="article">📝 文章专栏</option>
                    <option value="image-gallery">🖼️ 图片专栏</option>
                </select>
            </div>

            <div id="article-fields">

        function setPanelStatus(elementId, html, isError = false) {
            const status = document.getElementById(elementId);
            status.style.display = 'block';
            status.classList.toggle('error', isError);
            status.innerHTML = html;
        }

        function isSupabaseConfigured() {
            return /^https:\/\/.+\.supabase\.co$/i.test(String(SUPABASE_CONFIG.url || '').replace(/\/$/, ''))
                && String(SUPABASE_CONFIG.publishableKey || '').length > 20
                && !String(SUPABASE_CONFIG.publishableKey).startsWith('YOUR_');
        }

        function normalizeUsername(value) {
            return String(value || '').normalize('NFKC').trim().toLowerCase();
        }

        async function usernameToInternalEmail(username) {
            const normalized = normalizeUsername(username);
            const digest = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(normalized));
            const hash = Array.from(new Uint8Array(digest), byte => byte.toString(16).padStart(2, '0')).join('');
            return `${hash}@users.example`;
        }

        function showLoginScreen(message = '', isError = false) {
            document.getElementById('auth-overlay').style.display = 'block';
            document.getElementById('session-banner').style.display = 'none';
            document.querySelector('.create-post-btn').style.display = 'none';
            document.getElementById('app-root').innerHTML = '';
            if (message) setPanelStatus('login-status', escapeHtml(message), isError);
            else document.getElementById('login-status').style.display = 'none';
        }

        async function loadCurrentProfile(userId) {
            const { data, error } = await supabaseClient
                .from('profiles')
                .select('id, username, relationship, role, status')
                .eq('id', userId)
                .single();
            if (error) throw new Error(error.message);
            return data;
        }

        async function enterSite(session, profile) {
            currentUser = {
                id: session.user.id,
                username: profile.username,
                role: profile.role,
                status: profile.status
            };
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('access-request-overlay').style.display = 'none';
            document.getElementById('session-banner').style.display = 'block';
            const isAdmin = currentUser.role === 'admin';
            document.getElementById('session-greeting').textContent = isAdmin
                ? '欢迎回家，请随意创作'
                : `欢迎你的来访，“${currentUser.username}”`;
            document.getElementById('manage-users-button').style.display = isAdmin ? 'inline-block' : 'none';
            document.querySelector('.create-post-btn').style.display = isAdmin ? 'block' : 'none';

            const root = document.getElementById('app-root');
            root.innerHTML = '<div class="loading">📡 正在从 GitHub 加载专栏...</div>';
            postsDB = await loadAllPostsFromGitHub();
            await renderApp();
        }

        async function handleAuthenticatedSession(session) {
            if (!session?.user) {
                currentUser = null;
                showLoginScreen();
                return;
            }

            try {
                const profile = await loadCurrentProfile(session.user.id);
                if (profile.status !== 'approved') {
                    await supabaseClient.auth.signOut();
                    const message = profile.status === 'pending'
                        ? '您的访问申请仍在等待管理员审核。'
                        : '您的访问申请未通过，请联系管理员。';
                    showLoginScreen(message, profile.status !== 'pending');
                    return;
                }
                await enterSite(session, profile);
            } catch (error) {
                await supabaseClient.auth.signOut();
                showLoginScreen(`无法读取访问权限：${error.message}`, true);
            }
        }

        async function initializeAuthentication() {
            if (!isSupabaseConfigured()) {
                showLoginScreen('网站尚未完成 Supabase 配置。请先填写 supabase-config.js。', true);
                return;
            }
            if (!window.supabase?.createClient) {
                showLoginScreen('认证组件加载失败，请检查网络后刷新。', true);
                return;
            }

            supabaseClient = window.supabase.createClient(
                String(SUPABASE_CONFIG.url).replace(/\/$/, ''),
                SUPABASE_CONFIG.publishableKey,
                { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } }
            );
            const { data, error } = await supabaseClient.auth.getSession();
            if (error) {
                showLoginScreen(`读取登录状态失败：${error.message}`, true);
                return;
            }
            await handleAuthenticatedSession(data.session);
        }

        async function loginUser() {
            const button = document.getElementById('login-button');
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            if (!supabaseClient) { setPanelStatus('login-status', '网站认证尚未配置完成。', true); return; }
            if (!username || !password) { setPanelStatus('login-status', '请填写用户名和密码。', true); return; }

            button.disabled = true;
            button.textContent = '正在登录…';
            try {
                const email = await usernameToInternalEmail(username);
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) throw error;
                await handleAuthenticatedSession(data.session);
            } catch (error) {
                setPanelStatus('login-status', `登录失败：${escapeHtml(error.message === 'Invalid login credentials' ? '用户名或密码错误。' : error.message)}`, true);
            } finally {
                button.disabled = false;
                button.textContent = '登录';
            }
        }

        function openAccessRequest() {
            document.getElementById('request-username').value = '';
            document.getElementById('request-relationship').value = '';
            document.getElementById('request-password').value = '';
            document.getElementById('request-status').style.display = 'none';
            document.getElementById('request-register-button').style.display = 'block';
            document.getElementById('access-request-overlay').style.display = 'block';
        }

        function closeAccessRequest() {
            document.getElementById('access-request-overlay').style.display = 'none';
        }

        async function registerAccessRequest() {
            const button = document.getElementById('request-register-button');
            const username = document.getElementById('request-username').value.trim();
            const relationship = document.getElementById('request-relationship').value.trim();
            const password = document.getElementById('request-password').value;
            if (!supabaseClient) { setPanelStatus('request-status', '网站认证尚未配置完成。', true); return; }
            if (!username || !relationship || !password) { setPanelStatus('request-status', '请完整填写用户名、关系和密码。', true); return; }
            if (username.length > 50 || relationship.length > 150) { setPanelStatus('request-status', '用户名或关系内容过长。', true); return; }
            if (password.length < 8) { setPanelStatus('request-status', '密码至少需要 8 位。', true); return; }

            button.disabled = true;
            button.textContent = '正在注册…';
            try {
                const email = await usernameToInternalEmail(username);
                const { error } = await supabaseClient.auth.signUp({
                    email,
                    password,
                    options: { data: { username, relationship } }
                });
                if (error) throw error;
                await supabaseClient.auth.signOut();
                setPanelStatus('request-status', '已经将您的申请交给管理员，请在管理员审核成功后再次登录尝试');
                button.style.display = 'none';
            } catch (error) {
                setPanelStatus('request-status', `申请提交失败：${escapeHtml(error.message)}`, true);
            } finally {
                button.disabled = false;
                button.textContent = '注册';
            }
        }

        async function logoutCurrentUser() {
            if (supabaseClient) await supabaseClient.auth.signOut();
            currentUser = null;
            currentComments = [];
            closeUserManager();
            showLoginScreen();

            if (currentUser?.role === 'admin') return true;
            alert('只有管理员可以进行此操作。');
            return false;

            if (!ensureAdmin()) return;
            document.getElementById('user-manager-overlay').style.display = 'block';
            document.getElementById('user-manager-status').style.display = 'none';

        async function loadManagedUsers() {
            const list = document.getElementById('user-list');
            list.innerHTML = '<div class="loading">正在加载用户…</div>';
            const { data, error } = await supabaseClient
                .from('profiles')
                .select('id, username, relationship, role, status, created_at')
                .in('status', ['approved', 'pending']);
            if (error) {
                list.innerHTML = `<div class="error-message">加载用户失败：${escapeHtml(error.message)}</div>`;
                return;
            }

            managedUsers = (data || []).sort((a, b) => {
                const statusOrder = { approved: 0, pending: 1 };
                const roleOrder = { admin: 0, visitor: 1 };
                return statusOrder[a.status] - statusOrder[b.status]
                    || roleOrder[a.role] - roleOrder[b.role]
                    || String(a.created_at).localeCompare(String(b.created_at));
            });
            list.innerHTML = managedUsers.length ? managedUsers.map(user => {
                if (user.status === 'pending') {
                    return `
                        <div class="user-row pending" onclick="openReviewUser('${user.id}')">
                            <div class="user-name">${escapeHtml(user.username)}（待审核）</div>
                            <span>查看申请 →</span>
                        </div>
                    `;
                }
                return `
                    <div class="user-row ${user.role === 'admin' ? 'admin' : ''}">
                        <div class="user-name">
                            ${escapeHtml(user.username)}
                            ${user.role === 'admin' ? '<span class="role-badge">管理员</span>' : ''}
                        </div>
                        ${user.role === 'admin'
                            ? '<span class="protected-admin">固定管理员</span>'
                            : `<button class="remove-user-btn" onclick="removeUserAccess('${user.id}')">删除访问权限</button>`}
                    </div>

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>'"]/g, character => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            })[character]);
        }

        function chineseToPinyin(text) {
            if (!text) return '';
            let result = '';
            for (const character of text) {
                if (/[a-zA-Z0-9]/.test(character)) result += character;
                else if (pinyinMap[character]) result += pinyinMap[character];
                else result += '-';
            }
            return result.replace(/-+/g, '-').replace(/^-|-$/g, '').toLowerCase();
        }

        function sanitizePathPart(value, fallback = 'gallery') {
            const cleaned = String(value || '')
                .trim()
                .replace(/[\\/]+/g, '-')
                .replace(/\.\.+/g, '.')
                .replace(/[^a-zA-Z0-9._\-\u4e00-\u9fff]/g, '-')
                .replace(/-+/g, '-')
                .replace(/^[-.]+|[-.]+$/g, '');
            return cleaned || fallback;
        }

        function sanitizeFileName(name, index) {
            const lastDot = name.lastIndexOf('.');
            const rawBase = lastDot > 0 ? name.slice(0, lastDot) : name;
            const rawExt = lastDot > 0 ? name.slice(lastDot + 1) : 'jpg';
            const base = sanitizePathPart(rawBase, `image-${String(index + 1).padStart(2, '0')}`);
            const ext = rawExt.replace(/[^a-zA-Z0-9]/g, '').toLowerCase() || 'jpg';
            return `${String(index + 1).padStart(2, '0')}-${base}.${ext}`;
        }

        function encodeGitHubPath(path) {
            return String(path).split('/').filter(Boolean).map(encodeURIComponent).join('/');
        }

        function rawGitHubUrl(path) {
            return `https://raw.githubusercontent.com/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/${GITHUB_CONFIG.branch}/${encodeGitHubPath(path)}`;
        }

        function normalizeGitHubToken(value) {
            let token = String(value || '').trim();
            token = token.replace(/^(?:Bearer|token)\s+/i, '').trim();
            if ((token.startsWith('"') && token.endsWith('"')) || (token.startsWith("'") && token.endsWith("'"))) {
                token = token.slice(1, -1).trim();
            }
            return token;
        }

        function getGitHubErrorMessage(status, detail, action = 'GitHub 请求失败') {
            if (status === 401) {
                return 'Token 无效、已过期或已被撤销（401 Bad credentials）。请重新生成 Fine-grained Token，并只粘贴 github_pat_... 本身。';
            }
            if (status === 403) {
                return `Token 已被识别，但没有完成此操作的权限（403）。请确认仓库选择了 ${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}，并把 Contents 权限设为 Read and write。`;
            }
            return `${action}：${status} ${detail || '未知错误'}`;
        }

        function getTaipeiDate() {
            const parts = new Intl.DateTimeFormat('en-CA', {
                timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit'
            }).formatToParts(new Date());
            const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
            return `${values.year}-${values.month}-${values.day}`;
        }

        function bytesToBase64(bytes) {
            let binary = '';
            const chunkSize = 0x8000;
            for (let offset = 0; offset < bytes.length; offset += chunkSize) {
                binary += String.fromCharCode(...bytes.subarray(offset, offset + chunkSize));
            }
            return btoa(binary);
        }

        async function fileToBase64(file) {
            return bytesToBase64(new Uint8Array(await file.arrayBuffer()));
        }

        function textToBase64(text) {
            return bytesToBase64(new TextEncoder().encode(text));
        }

        async function githubRequest(url, options = {}) {
            const response = await fetch(url, options);
            if (response.ok) return response;

            let detail = '';
            try {
                const data = await response.json();
                detail = data.message || JSON.stringify(data);
            } catch (_) {
                detail = await response.text();
            }
            throw new Error(getGitHubErrorMessage(response.status, detail || response.statusText));
        }

        async function githubPutFile(path, base64Content, token, message) {
            const encodedPath = encodeGitHubPath(path);
            const apiUrl = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${encodedPath}`;
            const headers = {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${normalizeGitHubToken(token)}`,
                'X-GitHub-Api-Version': '2022-11-28',
                'Content-Type': 'application/json'
            };

            let sha;
            const existing = await fetch(`${apiUrl}?ref=${encodeURIComponent(GITHUB_CONFIG.branch)}`, { headers });
            if (existing.ok) {
                const existingData = await existing.json();
                sha = existingData.sha;
            } else if (existing.status !== 404) {
                let detail = '';
                try { detail = (await existing.json()).message || ''; } catch (_) {}
                throw new Error(getGitHubErrorMessage(existing.status, detail || existing.statusText, `无法检查 ${path}`));
            }

            const body = {
                message,
                content: base64Content,
                branch: GITHUB_CONFIG.branch
            };
            if (sha) body.sha = sha;

            return githubRequest(apiUrl, {
                method: 'PUT',
                headers,
                body: JSON.stringify(body)
            });
        }

        async function githubDeleteFile(path, token, message) {
            const encodedPath = encodeGitHubPath(path);
            const apiUrl = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${encodedPath}`;
            const headers = {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${normalizeGitHubToken(token)}`,
                'X-GitHub-Api-Version': '2022-11-28',
                'Content-Type': 'application/json'
            };

            const metadataResponse = await githubRequest(
                `${apiUrl}?ref=${encodeURIComponent(GITHUB_CONFIG.branch)}`,
                { headers, cache: 'no-store' }
            );
            const metadata = await metadataResponse.json();
            if (!metadata.sha || metadata.type !== 'file') {
                throw new Error(`无法取得待删除文件的 SHA：${path}`);
            }

            return githubRequest(apiUrl, {
                method: 'DELETE',
                headers,
                body: JSON.stringify({
                    message,
                    sha: metadata.sha,
                    branch: GITHUB_CONFIG.branch
                })
            });
        }

        async function listGitHubFolderFiles(path, token = '') {
            const encodedPath = encodeGitHubPath(path);
            const apiUrl = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${encodedPath}?ref=${encodeURIComponent(GITHUB_CONFIG.branch)}`;
            const headers = { Accept: 'application/vnd.github+json' };
            if (token) {
                headers.Authorization = `Bearer ${normalizeGitHubToken(token)}`;
                headers['X-GitHub-Api-Version'] = '2022-11-28';
            }
            const response = await githubRequest(apiUrl, { headers, cache: 'no-store' });
            const data = await response.json();
            return Array.isArray(data) ? data : [];
        }

        async function loadAllPostsFromGitHub() {
            const folders = ['dengjie', 'wangboning', 'together'];
            const allPosts = new Map();

            for (const folder of folders) {
                const apiUrl = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/posts/${folder}?ref=${encodeURIComponent(GITHUB_CONFIG.branch)}`;
                try {
                    const response = await fetch(apiUrl, { headers: { Accept: 'application/vnd.github+json' } });
                    if (response.status === 404) continue;
                    if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
                    const files = await response.json();
                    if (!Array.isArray(files)) continue;

                    for (const file of files) {
                        if (file.type !== 'file' || !file.name.toLowerCase().endsWith('.json')) continue;
                        try {
                            const contentResponse = await fetch(file.download_url, { cache: 'no-store' });
                            if (!contentResponse.ok) throw new Error(`${contentResponse.status}`);
                            const postData = await contentResponse.json();
                            const blockId = postData.blockId;
                            if (!blockId) continue;
                            if (!allPosts.has(blockId)) allPosts.set(blockId, []);
                            allPosts.get(blockId).push({
                                id: file.name,
                                path: file.path || `posts/${folder}/${file.name}`,
                                title: postData.title || '无标题',
                                author: postData.author || '未知作者',
                                date: postData.date || file.name.slice(0, 10),
                                type: postData.type || 'article',
                                content: postData.content || '',
                                imageFolder: postData.imageFolder || '',
                                images: Array.isArray(postData.images) ? postData.images : []
                            });
                        } catch (error) {
                            console.warn(`解析文件 ${file.name} 失败：`, error);
                        }
                    }
                } catch (error) {
                    console.warn(`加载 posts/${folder} 失败：`, error);
                }
            }

            for (const posts of allPosts.values()) {
                posts.sort((a, b) => String(b.date).localeCompare(String(a.date)) || String(b.id).localeCompare(String(a.id)));
            }
            return allPosts;
        }

                .eq('post_path', post.path || post.id)
                .order('created_at', { ascending: true });

                    authorId: row.author_id,
                    author: row.author_name,

        async function publishComment() {
            const button = document.getElementById('comment-publish-button');
            const content = document.getElementById('comment-content').value.trim();
            const files = Array.from(document.getElementById('comment-image-files').files || []);
            const post = currentPost;

            if (!post) { setCommentStatus('当前文章不存在，请刷新页面后重试。', true); return; }
            if (!currentUser || !supabaseClient) { setCommentStatus('登录已失效，请重新登录。', true); return; }
            if (!content && !files.length) { setCommentStatus('请填写评论内容或选择至少一张图片。', true); return; }
            if (files.some(file => !file.type.startsWith('image/'))) { setCommentStatus('所选文件中包含非图片文件。', true); return; }
            if (files.some(file => file.size > 25 * 1024 * 1024)) { setCommentStatus('单张图片不能超过 25 MB。', true); return; }

            const commentId = window.crypto.randomUUID();
            const imagePaths = [];

            button.disabled = true;
            button.textContent = '正在发布…';

            try {
                for (let index = 0; index < files.length; index += 1) {
                    const file = files[index];
                    const fileName = sanitizeFileName(file.name, index);
                    const imagePath = `${currentUser.id}/${commentId}/${fileName}`;
                    setCommentStatus(`正在上传第 ${index + 1}/${files.length} 张评论图片：<code>${escapeHtml(fileName)}</code>`);
                    const { error: uploadError } = await supabaseClient
                        .storage
                        .from('comment-images')
                        .upload(imagePath, file, { contentType: file.type, upsert: false });
                    if (uploadError) throw uploadError;
                    imagePaths.push(imagePath);
                }

                setCommentStatus('正在发布评论…');
                const { error: insertError } = await supabaseClient.from('comments').insert({
                    id: commentId,
                    post_path: post.path || post.id,
                    content,
                    images: imagePaths
                });
                if (insertError) throw insertError;

                setCommentStatus('<strong>评论发布成功。</strong>');
                document.getElementById('comment-content').value = '';
                document.getElementById('comment-image-files').value = '';
                document.getElementById('comment-selected-files').textContent = '尚未选择图片';
                await renderApp();
            } catch (error) {
                console.error(error);
                if (imagePaths.length) {
                    await supabaseClient.storage.from('comment-images').remove(imagePaths).catch(() => {});
                }
                setCommentStatus(`<strong>评论发布失败：</strong>${escapeHtml(error.message)}`, true);
            } finally {
                button.disabled = false;
                button.textContent = '发布评论';
            }
        }

                    const rawFolderName = document.getElementById('image-folder-name').value.trim();
                    const folderName = sanitizePathPart(rawFolderName, 'gallery');
                    const files = Array.from(document.getElementById('image-files').files || []);

                    if (!rawFolderName) throw new Error('请填写图片文件夹名称。');
                    if (!files.length) throw new Error('请选择至少一张图片。');
                    if (files.some(file => !file.type.startsWith('image/'))) throw new Error('所选文件中包含非图片文件。');
                    if (files.some(file => file.size > 25 * 1024 * 1024)) throw new Error('单张图片不能超过 25 MB。');

                    const imageFolder = `assets/images/${folderName}`;
                    const imagePaths = [];

                    for (let index = 0; index < files.length; index += 1) {
                        const file = files[index];
                        const fileName = sanitizeFileName(file.name, index);
                        const imagePath = `${imageFolder}/${fileName}`;
                        setUploadStatus(`正在上传第 ${index + 1}/${files.length} 张图片：<code>${escapeHtml(fileName)}</code>`);
                        await githubPutFile(
                            imagePath,
                            await fileToBase64(file),
                            token,
                            `Upload gallery image: ${title} (${index + 1}/${files.length})`
                        );
                        imagePaths.push(imagePath);
                    }

                    articleJSON = {
                        type: 'image-gallery',
                        title,
                        author,
                        date,
                        imageFolder,
                        images: imagePaths,
                        blockId: targetBlock
                    };
                } else {
                    const content = document.getElementById('post-content').value.trim();
                    if (!content) throw new Error('文章模式需要填写正文内容。');
                    articleJSON = {
                        type: 'article',
                        title,
                        author,
                        date,
                        content,
                        blockId: targetBlock
                    };
                }

                setUploadStatus(`正在发布专栏配置：<code>${escapeHtml(postPath)}</code>`);
                await githubPutFile(
                    postPath,
                    textToBase64(JSON.stringify(articleJSON, null, 2)),
                    token,
                    `Publish post: ${title}`
                );

                setUploadStatus(`
                    <strong>发布成功。</strong><br>
                    配置文件：<code>${escapeHtml(postPath)}</code><br>
                    GitHub Pages 更新通常需要稍后刷新页面才能看到。
                `);

                document.getElementById('post-title').value = '';
                document.getElementById('post-author').value = '';
                document.getElementById('post-content').value = '';
                document.getElementById('image-folder-name').value = '';
                document.getElementById('image-files').value = '';
                document.getElementById('selected-files').textContent = '尚未选择图片';

                postsDB = await loadAllPostsFromGitHub();
                if (currentPage === 'column_list') await renderApp();
            } catch (error) {
                console.error(error);
                setUploadStatus(`<strong>上传失败：</strong>${escapeHtml(error.message)}<br>请检查 Token 权限、仓库名称和网络。`, true);
            } finally {
                button.disabled = false;
                button.textContent = '⬆️ 上传并发布到 GitHub';
            }
        }

        function getPostsByBlock(blockId) {
            return postsDB.get(blockId) || [];
        }

        function openLightbox(imageSource) {
            document.getElementById('lightbox-img').src = imageSource;
            document.getElementById('lightbox').classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.getElementById('lightbox-img').src = '';
        }

        function normalizeArticleImageSources(content) {
            return String(content || '').replace(
                /src\s*=\s*(['"])assets\/images\/([^'"]+)\1/gi,
                (_match, _quote, filename) => `src="${rawGitHubUrl(`assets/images/${filename}`)}"`
            );
        }

        async function renderArticleDetailPage(post) {
            const content = normalizeArticleImageSources(post.content || '');
            const commentsHtml = await renderCommentsSection(post);
            const deleteButton = currentUser?.role === 'admin'
                ? `<button class="detail-delete-btn" onclick="openDeleteDialog('${encodeURIComponent(post.id)}')">🗑️ 删除专栏</button>`
                : '';
            return `
                <div>
                    <button class="comment-create-btn" onclick="openCommentEditor()">💬 评论</button>
                    <div class="detail-toolbar">
                        <button class="back-home-btn" onclick="goBackToColumnList()">← 返回专栏</button>
                        ${deleteButton}
                    </div>
                    <div class="article-detail-page">
                        <div class="article-detail-header">
                            <h1 class="article-detail-title">${escapeHtml(post.title)}</h1>
                            <div class="article-detail-meta">
                                <span>✍️ ${escapeHtml(post.author)}</span>
                                <span>📅 ${escapeHtml(post.date || '未知日期')}</span>
                            </div>
                        </div>
                        <div id="article-content" class="article-detail-content">${content || '暂无内容'}</div>
                        ${commentsHtml}
                    </div>
                </div>
            `;
        }

        async function loadGalleryImages(post) {
            if (Array.isArray(post.images) && post.images.length) {
                return post.images.map(path => ({
                    name: String(path).split('/').pop() || 'image',
                    url: /^https?:\/\//i.test(path) ? path : rawGitHubUrl(path)
                }));
            }

            if (!post.imageFolder) return [];
            const folderPath = encodeGitHubPath(post.imageFolder);
            const apiUrl = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${folderPath}?ref=${encodeURIComponent(GITHUB_CONFIG.branch)}`;
            const response = await fetch(apiUrl, { headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store' });
            if (response.status === 404) throw new Error(`找不到图片文件夹：${post.imageFolder}`);
            if (!response.ok) throw new Error(`读取图片文件夹失败：${response.status} ${response.statusText}`);
            const files = await response.json();
            if (!Array.isArray(files)) return [];

            return files
                .filter(file => file.type === 'file' && /\.(jpe?g|png|gif|webp|avif|bmp|svg)$/i.test(file.name))
                .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }))
                .map(file => ({ name: file.name, url: file.download_url || rawGitHubUrl(file.path) }));
        }

        async function renderImageGalleryPage(post) {
            const deleteButton = currentUser?.role === 'admin'
                ? `<button class="detail-delete-btn" onclick="openDeleteDialog('${encodeURIComponent(post.id)}')">🗑️ 删除专栏</button>`
                : '';
            try {
                const images = await loadGalleryImages(post);
                const commentsHtml = await renderCommentsSection(post);
                const galleryHtml = images.length
                    ? `<div class="gallery-grid">${images.map(image => {
                        const encodedUrl = encodeURIComponent(image.url);
                        return `<figure class="gallery-card"><img src="${escapeHtml(image.url)}" alt="${escapeHtml(image.name)}" loading="lazy" onclick="openLightbox(decodeURIComponent('${encodedUrl}'))"></figure>`;
                    }).join('')}</div>`
                    : '<div class="gallery-empty">图片专栏中还没有可显示的图片。</div>';

                return `
                    <div>
                        <button class="comment-create-btn" onclick="openCommentEditor()">💬 评论</button>
                        <div class="detail-toolbar">
                            <button class="back-home-btn" onclick="goBackToColumnList()">← 返回专栏</button>
                            ${deleteButton}
                        </div>
                        <div class="article-detail-page">
                            <div class="article-detail-header">
                                <h1 class="article-detail-title">${escapeHtml(post.title)}</h1>
                                <div class="article-detail-meta">
                                    <span>✍️ ${escapeHtml(post.author)}</span>
                                    <span>📅 ${escapeHtml(post.date || '未知日期')}</span>
                                    <span>🖼️ ${images.length} 张图片</span>
                                </div>
                            </div>
                            ${galleryHtml}
                            ${commentsHtml}
                        </div>
                    </div>
                `;
            } catch (error) {
                return `
                    <div>
                        <button class="comment-create-btn" onclick="openCommentEditor()">💬 评论</button>
                        <div class="detail-toolbar">
                            <button class="back-home-btn" onclick="goBackToColumnList()">← 返回专栏</button>
                            ${deleteButton}
                        </div>
                        <div class="article-detail-page">
                            <div class="error-message">图片加载失败：${escapeHtml(error.message)}</div>
                        </div>
                    </div>
                `;
            }
        }

        async function renderColumnListPage(blockId, blockTitle) {
            const posts = getPostsByBlock(blockId);
            if (!posts.length) {
                return `
                    <div class="column-container">
                        <div class="back-home-bar"><button class="back-home-btn" onclick="backToHome()">← 返回主页</button></div>
                        <div class="column-header"><h2>📂 ${escapeHtml(blockTitle)}</h2></div>
                        <div class="empty-posts">${currentUser?.role === 'admin' ? '暂无内容，点击右上角“创作文章”发布。' : '暂无内容。'}</div>
                    </div>
                `;
            }

            const postsHtml = posts.map(post => `
                <div class="post-card">
                    <div class="post-title">${escapeHtml(post.title)}</div>
                    <div class="post-meta">
                        <span>✍️ ${escapeHtml(post.author)}</span>
                        <span>📅 ${escapeHtml(post.date || '未知日期')}</span>
                        <span class="post-type-badge">${post.type === 'image-gallery' ? '🖼️ 图片专栏' : '📝 文章'}</span>
                    </div>
                    ${currentUser?.role === 'admin' ? `<button class="delete-post-btn" onclick="openDeleteDialog('${encodeURIComponent(post.id)}')">🗑️ 删除</button>` : ''}
                    <button class="read-more-link" onclick="viewArticleDetail('${encodeURIComponent(post.id)}')">阅读原文 →</button>
                </div>
            `).join('');

            return `
                <div class="column-container">
                    <div class="back-home-bar"><button class="back-home-btn" onclick="backToHome()">← 返回主页</button></div>
                    <div class="column-header"><h2>📂 ${escapeHtml(blockTitle)}</h2><p style="color:#6c8dae;">共 ${posts.length} 个专栏</p></div>
                    <div class="posts-grid">${postsHtml}</div>
                </div>
            `;
        }

        function setDeleteStatus(html, isError = false) {
            const status = document.getElementById('delete-status');
            status.style.display = 'block';
            status.classList.toggle('error', isError);
            status.innerHTML = html;
        }

        function findPostInCurrentBlock(encodedPostId) {
            const postId = decodeURIComponent(encodedPostId);
            return getPostsByBlock(currentBlockId).find(item => item.id === postId) || null;
        }

        function openDeleteDialog(encodedPostId) {
            if (!ensureAdmin()) return;
            const post = findPostInCurrentBlock(encodedPostId);
            if (!post) {
                alert('找不到要删除的专栏。请刷新页面后重试。');
                return;
            }

            pendingDeletePost = post;
            document.getElementById('delete-target').innerHTML = `
                <strong>${escapeHtml(post.title)}</strong><br>
                <span style="color:#64748b;font-size:.8rem;">${escapeHtml(post.path || post.id)}</span>
            `;
            document.getElementById('delete-images-row').style.display = post.type === 'image-gallery' ? 'flex' : 'none';
            document.getElementById('delete-gallery-images').checked = false;
            document.getElementById('delete-confirm-checkbox').checked = false;
            document.getElementById('delete-github-token').value = '';
            document.getElementById('delete-status').style.display = 'none';
            document.getElementById('delete-overlay').style.display = 'block';
        }

        function closeDeleteDialog() {
            document.getElementById('delete-overlay').style.display = 'none';
            pendingDeletePost = null;
        }

        async function getGalleryRepositoryImagePaths(post, token) {
            const directPaths = Array.isArray(post.images)
                ? post.images.filter(path => typeof path === 'string' && path && !/^https?:\/\//i.test(path))
                : [];
            if (directPaths.length) return [...new Set(directPaths)];
            if (!post.imageFolder) return [];

            const files = await listGitHubFolderFiles(post.imageFolder, token);
            return files
                .filter(file => file.type === 'file' && /\.(jpe?g|png|gif|webp|avif|bmp|svg)$/i.test(file.name))
                .map(file => file.path)
                .filter(Boolean);
        }

        async function deleteSelectedPost() {
            if (!ensureAdmin()) return;
            const button = document.getElementById('delete-confirm-button');
            const token = normalizeGitHubToken(document.getElementById('delete-github-token').value);
            const confirmed = document.getElementById('delete-confirm-checkbox').checked;
            const deleteImages = document.getElementById('delete-gallery-images').checked;
            const post = pendingDeletePost;

            if (!post) { setDeleteStatus('没有选中待删除的专栏。', true); return; }
            if (!token) { setDeleteStatus('请输入 GitHub Fine-grained Token。', true); return; }
            if (!confirmed) { setDeleteStatus('请先勾选删除确认。', true); return; }
            if (!post.path) { setDeleteStatus('当前专栏缺少 GitHub 文件路径，请刷新页面后重试。', true); return; }

            button.disabled = true;
            button.textContent = '正在删除…';

            try {
                if (post.type === 'image-gallery' && deleteImages) {
                    const imagePaths = await getGalleryRepositoryImagePaths(post, token);
                    for (let index = 0; index < imagePaths.length; index += 1) {
                        const imagePath = imagePaths[index];
                        setDeleteStatus(`正在删除图片 ${index + 1}/${imagePaths.length}：<code>${escapeHtml(imagePath)}</code>`);
                        await githubDeleteFile(
                            imagePath,
                            token,
                            `Delete gallery image: ${post.title} (${index + 1}/${imagePaths.length})`
                        );
                    }
                }

                setDeleteStatus(`正在删除专栏配置：<code>${escapeHtml(post.path)}</code>`);
                await githubDeleteFile(post.path, token, `Delete post: ${post.title}`);

                postsDB = await loadAllPostsFromGitHub();
                currentPage = 'column_list';
                currentPost = null;
                pendingDeletePost = null;
                document.getElementById('delete-overlay').style.display = 'none';
                await renderApp();
            } catch (error) {
                console.error(error);
                setDeleteStatus(`<strong>删除失败：</strong>${escapeHtml(error.message)}<br>请检查 Token 权限、文件是否已被删除以及网络状态。`, true);
            } finally {
                button.disabled = false;
                button.textContent = '永久删除';
            }
        }

        function viewArticleDetail(encodedPostId) {
            const postId = decodeURIComponent(encodedPostId);
            const post = getPostsByBlock(currentBlockId).find(item => item.id === postId);
            if (!post) { alert('文章不存在'); return; }
            currentPage = 'article_detail';
            currentPost = post;
            renderApp();
        }

        function goBackToColumnList() {
            currentPage = 'column_list';
            currentPost = null;
            renderApp();
        }

        function goToColumnList(blockId, blockTitle) {
            currentPage = 'column_list';
            currentBlockId = blockId;
            currentBlockTitle = blockTitle;
            currentPost = null;
            renderApp();
        }

        function backToHome() {
            currentPage = 'index';
            currentBlockId = null;
            currentBlockTitle = null;
            currentPost = null;
            renderApp();
        }

        function attachArticleImageLightbox() {
            document.querySelectorAll('#article-content img').forEach(image => {
                image.addEventListener('click', () => openLightbox(image.currentSrc || image.src));
            });
        }

        async function renderApp() {
            const root = document.getElementById('app-root');

            if (currentPage === 'index') {
                root.innerHTML = `
                    <div class="hero-index">
                        <div class="greeting-tag">✦ 双人宇宙 ✦</div>
                        <div class="main-headline">邓杰 · 王泊宁<br>两人的日常</div>
                        <div class="subhead">独立轨迹 · 交叠星光</div>
                        <div class="triple-links">
                            <div class="daily-card" data-person="dengjie"><div class="card-icon">🌿</div><div class="card-name">邓杰的日常</div><div class="card-desc">全栈 · 光影收集者</div></div>
                            <div class="daily-card" data-person="wangboning"><div class="card-icon">🎨</div><div class="card-name">王泊宁的日常</div><div class="card-desc">创意开发 · 设计思维</div></div>
                            <div class="daily-card" data-person="together"><div class="card-icon">✨🤝✨</div><div class="card-name">两人的共同日常</div><div class="card-desc">共同项目 · 双城灵感</div></div>
                        </div>
                        <div class="footer-note">点击卡片进入 · 支持文章专栏和图片专栏</div>
                    </div>
                `;
                document.querySelectorAll('.daily-card').forEach(card => {
                    card.addEventListener('click', () => { currentPage = card.dataset.person; renderApp(); });
                });
                return;
            }

            if (currentPage === 'column_list') {
                root.innerHTML = await renderColumnListPage(currentBlockId, currentBlockTitle);
                return;
            }

            if (currentPage === 'article_detail') {
                root.innerHTML = '<div class="loading">正在加载内容...</div>';
                if (currentPost?.type === 'image-gallery') {
                    root.innerHTML = await renderImageGalleryPage(currentPost);
                } else {
                    root.innerHTML = await renderArticleDetailPage(currentPost || {});
                    attachArticleImageLightbox();
                }
                return;
            }

            const data = personsData[currentPage];
            if (!data) { backToHome(); return; }
            const block1Html = `<div class="block-split-3">${data.block1Items.map((item, index) => `
                <div class="shape-card ${index === 0 ? 'shape-triangle-left' : index === 1 ? 'shape-trapezoid-mid' : 'shape-reverse-triangle'}">
                    <a class="section-link" onclick="goToColumnList('${item.blockId}','${escapeHtml(item.title)}')">↗</a>
                    <div class="block-icon">${item.icon}</div><h3>${escapeHtml(item.title)}</h3><p>${escapeHtml(item.desc)}</p>
                </div>
            `).join('')}</div>`;
            const block2Html = `<div class="block-single"><a class="section-link" onclick="goToColumnList('${data.singleBlockId}','${escapeHtml(data.singleTitle)}')">↗</a><div class="single-content"><div><h2>${escapeHtml(data.singleTitle)}</h2>${data.singleDesc ? `<p>${escapeHtml(data.singleDesc)}</p>` : ''}</div>${data.singleStat ? `<div class="single-stats">✨ ${escapeHtml(data.singleStat)}</div>` : ''}</div></div>`;
            const block3Html = `<div class="block-split-2"><div class="dual-left"><a class="section-link" onclick="goToColumnList('${data.leftBlockId}','${escapeHtml(data.leftTitle)}')">↗</a><h3>${escapeHtml(data.leftTitle)}</h3><div class="hobby-list">${data.leftHobbies.map(hobby => `<span class="hobby-badge">${escapeHtml(hobby)}</span>`).join('')}</div><p>“${escapeHtml(data.leftQuote)}”</p></div><div class="dual-right"><a class="section-link" onclick="goToColumnList('${data.rightBlockId}','${escapeHtml(data.rightTitle)}')">↗</a><h3>${escapeHtml(data.rightTitle)}</h3><div class="hobby-list">${data.rightHobbies.map(hobby => `<span class="hobby-badge">${escapeHtml(hobby)}</span>`).join('')}</div><p>“${escapeHtml(data.rightQuote)}”</p></div></div>`;
            root.innerHTML = `<div class="detail-page"><div class="back-home-bar"><button class="back-home-btn" onclick="backToHome()">← 返回首页</button></div><div style="text-align:center;margin-bottom:1rem;"><h1>${escapeHtml(data.name)}</h1><div>${escapeHtml(data.titleNote)}</div><div style="color:#6c8dae;">${escapeHtml(data.roleDesc)}</div></div><div class="irregular-stack">${block1Html}${block2Html}${block3Html}</div><div class="detail-footer" style="text-align:center;margin-top:2rem;font-size:0.75rem;color:#8ba0bc;">点击 ↗ 进入专栏 · 支持文章和图片两种类型</div></div>`;
        }

        function openEditor() {
            if (!ensureAdmin()) return;
            document.getElementById('editor-overlay').style.display = 'block';
            document.getElementById('upload-guide').style.display = 'none';
            document.getElementById('post-type').dispatchEvent(new Event('change'));
        }

        function closeEditor() {
            document.getElementById('editor-overlay').style.display = 'none';
        }

        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                closeLightbox();
                closeEditor();
                closeDeleteDialog();
                closeCommentEditor();
                closeCommentDeleteDialog();
                closeAccessRequest();
                closeUserManager();
            }
        });

        (async function init() {
            try {
                await initializeAuthentication();
            } catch (error) {
                console.error('初始化失败：', error);
                showLoginScreen(`初始化失败：${error.message}`, true);
            }
        })();
    </script>
</body>
</html>
